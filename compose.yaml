services:
  research:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FINAGENT_API_KEY: ${FINAGENT_API_KEY:?Set a random API secret of at least 16 characters}
    volumes:
      - memory:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  memory:
